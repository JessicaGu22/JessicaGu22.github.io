<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jessica's Terminal</title>
    <style>
        body {
            background-color: black;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0;
            flex-wrap: wrap;
        }

        nav ul li {
            margin: 0 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ff6347;
        }

        #terminal {
            max-width: 800px;
            margin: 20px auto;
            white-space: pre-wrap;
            flex-grow: 1;
            overflow-y: auto;
            border: 2px solid #33ff33;
            padding: 15px;
            border-radius: 8px;
            background-color: #000a;
        }

        .input-line {
            display: flex;
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .prompt {
            margin-right: 5px;
            user-select: none;
        }

        #commandInput {
            background: none;
            border: none;
            color: #33ff33;
            font-family: inherit;
            font-size: 1.2em;
            outline: none;
            width: 100%;
        }

        .blinking {
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            user-select: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Jessica Gu</h1>
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="contactform.html">Contact Form</a></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="work.html">My Work</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="challenge.html">Challenge</a></li>
                <li><a href="terminal.html">Terminal</a></li>
            </ul>
        </nav>
    </header>

    <div id="terminal" aria-live="polite" aria-label="Terminal output">
        <div>> Welcome to Jessica's Terminal.<br>Type <strong>help</strong> to see commands.<br></div>
    </div>
    <div class="input-line">
        <span class="prompt">&gt; </span>
        <input type="text" id="commandInput" autofocus autocomplete="off" aria-label="Terminal command input" />
    </div>

    <footer>
        <p>&copy; 2024 Jessica Gu. All rights reserved.</p>
    </footer>

    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('commandInput');
        const history = [];
        let historyIndex = 0;

        // Guided tour steps
        const tourSteps = [
            "Welcome to Jessica's website! Here you can learn about me step by step.",
            "First, try 'bio' to learn about me.",
            "Next, try 'skills' to see what I can do.",
            "Type 'hobbies' to see what I enjoy in my free time.",
            "Use 'goals' to understand my ambitions.",
            "That's the end of the tour! Type 'help' anytime for commands.",
        ];

        let tourStepIndex = 0;
        let inTour = false;

        // Mini-game: guess the number 1-10
        let gameActive = false;
        let secretNumber = 0;
        let guesses = 0;

        // Interactive FAQ keywords and thoughtful answers
        const faq = {
            "where are you from": "I'm from California, currently a student at Redwood High School.",
            "what do you study": "I study biology and computer science, with a passion for medical research.",
            "favorite hobby": "I love photography, traveling, practicing Wing Chun, and playing the guzheng.",
            "dream job": "My dream job is to become a doctor and contribute to medical research.",
            "coding skills": "I know HTML, CSS, JavaScript, and Python, and I enjoy building projects.",
            "how can i contact you": "You can reach me through the Contact Form on this site.",
            "clear": "Use the 'clear' command to clean the terminal screen."
        };

        function printToTerminal(text) {
            terminal.innerHTML += '\n' + text;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            terminal.innerHTML = '';
        }

        function startTour() {
            inTour = true;
            tourStepIndex = 0;
            printToTerminal("> Starting guided tour. Type 'next' to continue or 'exit' to quit.");
            printToTerminal(tourSteps[tourStepIndex]);
        }

        function tourNext() {
            tourStepIndex++;
            if (tourStepIndex >= tourSteps.length) {
                printToTerminal("> Tour finished. You can continue exploring or type 'help'.");
                inTour = false;
            } else {
                printToTerminal(tourSteps[tourStepIndex]);
            }
        }

        function startGame() {
            gameActive = true;
            secretNumber = Math.floor(Math.random() * 10) + 1;
            guesses = 0;
            printToTerminal("> Guess the secret number between 1 and 10! Type your guess.");
        }

        function processGameInput(input) {
            guesses++;
            const guess = parseInt(input, 10);
            if (isNaN(guess) || guess < 1 || guess > 10) {
                printToTerminal("> Please enter a number between 1 and 10.");
                return;
            }
            if (guess === secretNumber) {
                printToTerminal(`> 🎉 Correct! You guessed it in ${guesses} tries.`);
                gameActive = false;
            } else if (guess < secretNumber) {
                printToTerminal("> Too low! Try again.");
            } else {
                printToTerminal("> Too high! Try again.");
            }
        }

        function handleCommand(command) {
            if (inTour) {
                if (command === 'next') {
                    tourNext();
                    return;
                } else if (command === 'exit') {
                    printToTerminal("> Exiting tour. You can type other commands now.");
                    inTour = false;
                    return;
                } else {
                    printToTerminal("> You're in a tour! Type 'next' to continue or 'exit' to quit.");
                    return;
                }
            }

            if (gameActive) {
                processGameInput(command);
                return;
            }

            switch (command) {
                case 'help':
                    printToTerminal(`Available commands:
- bio: Learn about Jessica
- skills: See Jessica's skills
- hobbies: See what Jessica enjoys
- goals: Learn about Jessica's ambitions
- tour: Start a guided tour
- faq: Ask a question (e.g. "Where are you from?")
- game: Play a number guessing game
- clear: Clear the terminal screen
- help: Show this help message`);
                    break;
                case 'bio':
                    printToTerminal("Jessica is a student at Redwood High School passionate about science, coding, and service.");
                    break;
                case 'skills':
                    printToTerminal("Skills:\n- HTML, CSS, JavaScript, Python\n- Data analysis\n- Biomedical research projects");
                    break;
                case 'hobbies':
                    printToTerminal("Hobbies:\n- Photography\n- Traveling\n- Wing Chun martial arts\n- Playing the guzheng");
                    break;
                case 'goals':
                    printToTerminal("Goals:\n- Become a doctor\n- Contribute to medical research\n- Inspire others");
                    break;
                case 'tour':
                    startTour();
                    break;
                case 'faq':
                    printToTerminal("> Type a question related to me, e.g., 'Where are you from?'");
                    break;
                case 'game':
                    startGame();
                    break;
                case 'clear':
                    clearTerminal();
                    break;
                default:
                    // Check FAQ for keywords in command (basic keyword matching)
                    const foundFAQ = Object.keys(faq).find(key => command.includes(key));
                    if (foundFAQ) {
                        printToTerminal(faq[foundFAQ]);
                    } else {
                        printToTerminal(`Unknown command: ${command}. Type 'help' for a list of commands.`);
                    }
                    break;
            }
        }

        commandInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const command = commandInput.value.trim().toLowerCase();
                if (!command) return;
                history.push(command);
                historyIndex = history.length;
                commandInput.value = '';
                printToTerminal(`> ${command}`);
                handleCommand(command);
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    commandInput.value = history[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    commandInput.value = history[historyIndex];
                } else {
                    commandInput.value = '';
                }
            }
        });
    </script>
</body>

</html>
