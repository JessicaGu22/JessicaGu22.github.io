<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles/contactfrom.css" />
    <script defer src="scripts/contact.js"></script>
</head>

<body>
    <header>
        <h1>Jessica Gu</h1>
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="contactform.html">Contact Form</a></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="work.html">My Work</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="challenge.html">Challenge</a></li>
                <li><a href="terminal.html">Terminal</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact">
            <h2>Contact Me</h2>
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send</button>
            </form>
            <div class="toast" id="toast">Message Sent! ✅</div>

            <label for="colorPicker">🎨 Theme Color:</label>
            <input type="color" id="colorPicker" />
        </section>
    </main>

    <!-- Chat UI -->
    <div id="chatbox">
        <div id="chat-header">
            <img src="photos/bot-avatar.png" alt="Bot" class="chat-avatar" />
            AI Assistant 🤖
            <span id="chat-toggle" style="cursor:pointer; font-weight:bold;">×</span>
        </div>
        <div id="chat-log"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask me anything..." />
            <input type="file" id="file-upload" />
            <button id="send-btn">Send</button>
        </div>
    </div>
    <div id="chat-icon" title="Open chat">💬</div>

    <canvas id="confettiCanvas"
        style="position: fixed; pointer-events: none; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998;"></canvas>

    <footer>
        <p>&copy; 2025 Jessica Gu. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>

</html>
